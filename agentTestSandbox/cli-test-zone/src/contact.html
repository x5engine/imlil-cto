<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Us</title><link rel="stylesheet" href="./styles/contact.css"></head><body><div class="container"><h1>Contact Us</h1><form id="contactForm" class="contact-form"><div class="form-group"><label for="name">Name:</label><input type="text" id="name" name="name" required><span class="error-message" id="nameError"></span></div><div class="form-group"><label for="email">Email:</label><input type="email" id="email" name="email" required><span class="error-message" id="emailError"></span></div><div class="form-group"><label for="subject">Subject:</label><input type="text" id="subject" name="subject" required><span class="error-message" id="subjectError"></span></div><div class="form-group"><label for="message">Message:</label><textarea id="message" name="message" required></textarea><span class="error-message" id="messageError"></span></div><button type="submit" class="submit-btn">Send Message</button></form><div id="successMessage" class="success-message hidden">Thank you for your message! We'll get back to you soon.</div></div><script src="./js/contact.js"></script></body></html>
